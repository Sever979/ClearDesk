name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Fetch source into a Windows-safe directory
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'cleardesk-source'
          git init $source
          git -C $source fetch --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Build application and installer
        shell: powershell
        working-directory: ${{ runner.temp }}/cleardesk-source
        run: ./source/build.ps1
      - name: Compute SHA-256 checksums
        shell: powershell
        working-directory: ${{ runner.temp }}/cleardesk-source
        run: |
          Get-FileHash ClearDesk.exe, ClearDesk-Setup.exe -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ASCII
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClearDesk-Windows
          path: |
            ${{ runner.temp }}/cleardesk-source/ClearDesk.exe
            ${{ runner.temp }}/cleardesk-source/ClearDesk-Setup.exe
            ${{ runner.temp }}/cleardesk-source/LICENSE.txt
            ${{ runner.temp }}/cleardesk-source/README.md
            ${{ runner.temp }}/cleardesk-source/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClearDesk-Windows
          path: dist
      - name: Package and publish version 1.1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release v1.1.1 already exists; leaving it unchanged.'; exit 0 }
          Compress-Archive -Path dist/ClearDesk.exe, dist/LICENSE.txt, dist/README.md -DestinationPath dist/ClearDesk-1.1.1-portable.zip
          Get-FileHash dist/ClearDesk.exe, dist/ClearDesk-Setup.exe, dist/ClearDesk-1.1.1-portable.zip -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt -Encoding ASCII
          gh release create v1.1.1 dist/ClearDesk-Setup.exe dist/ClearDesk.exe dist/ClearDesk-1.1.1-portable.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'ClearDesk 1.1.1' --notes-file docs/RELEASE-v1.1.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
